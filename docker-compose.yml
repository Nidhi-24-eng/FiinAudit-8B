version: "3.9"

services:
  finaudit-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: finaudit-8b:latest
    container_name: finaudit-api
    ports:
      - "8000:8000"
    volumes:
      # Mount your quantized model directory from the host
      - ./checkpoints/finaudit-awq:/models/finaudit-awq:ro
    environment:
      - MODEL_PATH=/models/finaudit-awq
      - MAX_MODEL_LEN=4096
      - GPU_MEM_UTILIZATION=0.90
      - MAX_NUM_SEQS=64
      - TENSOR_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
